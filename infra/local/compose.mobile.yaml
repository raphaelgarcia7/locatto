services:
  backend:
    environment:
      AUTH_ORIGIN: ${LOCATTO_ORIGIN:?local mobile origin required}
  frontend:
    command: [nginx, -g, "daemon off;", -c, /etc/nginx/nginx.mobile.conf]
    ports:
      - "${LOCATTO_LAN_IP:?local Wi-Fi address required}:8080:8080"
      - "${LOCATTO_LAN_IP:?local Wi-Fi address required}:8443:8443"
    volumes:
      - mobile_tls:/etc/nginx/certs:ro
volumes:
  mobile_tls:
    name: locatto-desktop-mobile-tls
