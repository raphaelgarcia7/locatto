name: locatto-desktop
services:
  prepare:
    image: locatto-local-backend:installed
    build:
      context: ../..
      dockerfile: infra/operations/Dockerfile.backend
    user: "0:0"
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        for path in /private/photos /private/operations /private/backups /private/keys /private/scratch; do
          chown 10001:10001 "$$path"
          chmod 700 "$$path"
        done
        chown 0:0 /private/database-auth
        chmod 700 /private/database-auth
        chown 0:0 /private/mobile-tls
        chmod 755 /private/mobile-tls
        if [ ! -f /private/keys/recipient.txt ]; then
          umask 077
          age-keygen -o /private/keys/identity.txt 2>/dev/null
          age-keygen -y /private/keys/identity.txt > /private/keys/recipient.txt
          chown 10001:10001 /private/keys/*
        fi
    volumes:
      - photos:/private/photos
      - operations:/private/operations
      - backups:/private/backups
      - keys:/private/keys
      - scratch:/private/scratch
      - database_auth:/private/database-auth
      - mobile_tls:/private/mobile-tls
  database:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: locatto
      POSTGRES_USER: locatto_bootstrap
      POSTGRES_PASSWORD_FILE: /run/database-auth/postgres-password
    volumes:
      - database:/var/lib/postgresql/data
      - database_auth:/run/database-auth:ro
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U locatto_bootstrap -d locatto"]
      interval: 5s
      timeout: 3s
      retries: 24
  backend:
    image: locatto-local-backend:installed
    env_file: ${LOCATTO_BACKEND_ENV:?local configuration required}
    environment:
      APP_ENV: development
      AUTH_ORIGIN: http://localhost:8080
      STORAGE_ROOT: /private/photos
      OPERATIONS_ROOT: /private/operations
    volumes:
      - photos:/private/photos
      - operations:/private/operations
      - backups:/private/backups
      - keys:/private/keys:ro
      - scratch:/private/scratch
    depends_on:
      prepare: {condition: service_completed_successfully}
      database: {condition: service_healthy}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 24
  frontend:
    image: locatto-local-frontend:installed
    build:
      context: ../..
      dockerfile: infra/operations/Dockerfile.frontend
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/api/ready]
      interval: 10s
      timeout: 6s
      retries: 12
volumes:
  database: {name: locatto-desktop-database}
  photos: {name: locatto-desktop-photos}
  operations: {name: locatto-desktop-operations}
  backups: {name: locatto-desktop-backups}
  keys: {name: locatto-desktop-keys}
  scratch: {name: locatto-desktop-scratch}
  database_auth: {name: locatto-desktop-database-auth}
  mobile_tls: {name: locatto-desktop-mobile-tls}
