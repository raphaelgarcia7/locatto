name: Quality negative proof - never merge
on:
  workflow_call:
    inputs:
      scenario:
        required: true
        type: string
permissions:
  contents: read
jobs:
  backend:
    if: inputs.scenario != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Controlled backend result
        run: test '${{ inputs.scenario }}' != backend
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Controlled frontend result
        run: test '${{ inputs.scenario }}' != frontend
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Controlled browser result
        run: test '${{ inputs.scenario }}' != browser
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Controlled secrets result
        run: test '${{ inputs.scenario }}' != secrets
      - name: Detect deliberate synthetic noncredential in temporary file
        if: inputs.scenario == 'synthetic-secret'
        run: |
          curl --fail --location --silent --show-error -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          mkdir "$RUNNER_TEMP/synthetic"
          python3 -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"synthetic","example.txt").write_text("aws_access_key_id = " + "AKIA" + "0123456789ABCDEF")'
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/synthetic" --redact --no-banner
  quality-gate:
    if: always()
    needs: [backend, frontend, browser, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      BACKEND_RESULT: ${{ needs.backend.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      BROWSER_RESULT: ${{ needs.browser.result }}
      SECRETS_RESULT: ${{ needs.secrets.result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 infra/automation/quality_gate.py
